/* ---------- state (browser only) ---------- */
let S={done:{},exam:'2027-02-17'};
try{const r=localStorage.getItem('boardready.v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('boardready.v1',JSON.stringify(S))}catch(e){}if(typeof TOKEN!=='undefined'&&TOKEN){clearTimeout(pushT);pushT=setTimeout(pushNow,700)}};
const key=(s,c)=>s+'|'+c;
const get=(s,c)=>S.done[key(s,c)]||[0,0,0];
const items=s=>s.groups.flatMap(g=>g.i);
const stat=s=>{const it=items(s);let d=0;it.forEach(c=>get(s.id,c).forEach(v=>d+=v));return{done:d,total:it.length*3,pct:Math.round(d/(it.length*3)*100),full:it.filter(c=>get(s.id,c).every(Boolean)).length,n:it.length}};
const mine=()=>{const m=(typeof USER!=='undefined'&&USER&&USER.subjects)||[];const r=SUBJECTS.filter(s=>m.includes(s.id));return r.length?r:SUBJECTS};
const overall=()=>{let d=0,t=0;mine().forEach(s=>{const x=stat(s);d+=x.done;t+=x.total});return Math.round(d/t*100)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ring=(p,c)=>{const r=26,L=2*Math.PI*r;return`<div class="ring"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="${r}"/><circle cx="32" cy="32" r="${r}" stroke="${c}" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p/100)}"/></svg><b>${p}%</b></div>`};
const daysLeft=()=>{if(!S.exam)return null;const d=Math.ceil((new Date(S.exam+'T00:00:00')-new Date(new Date().toDateString()))/864e5);return isNaN(d)?null:d};
const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});

  const dl=daysLeft();
  const cards=mine().map(s=>{const x=stat(s);return`<a class="card glass" href="#${s.id}" style="--sc:${s.color}">
    <div class="row">${ring(x.pct,s.color)}<div><h3>${s.name}</h3><div class="meta">${s.sub}</div></div></div>
    <div class="bar"><i style="width:${x.pct}%"></i></div>
    <div class="meta">${x.full} of ${x.n} chapters fully revised</div></a>`}).join('');
  return`<section class="hero glass"><div>
      <h1>Your complete Class 10 board roadmap</h1>
      <p>${mine().length===6?'Six subjects':mine().length+' of your subjects'}, every chapter, three steps each: study it, practise it, revise it. Tick them off and watch the rings fill.</p>
      <div class="days"><label for="exam">First board exam on</label><input type="date" id="exam" value="${S.exam||''}">
      <span>${dl==null?'Pick a date to get a countdown.':dl>0?`<b>${dl} days</b> to go`:dl===0?'<b>Exam day.</b> Good luck.':'Date has passed. Update it.'}</span></div></div>
    <div class="big"><b>${overall()}%</b><span>of the full syllabus done</span></div></section>
    ${USER?'':`<div class="note glass">Create a free account to save your progress and see it again whenever you log in. <a href="#account">Sign up or log in</a></div>`}
    <div class="sec-title" style="margin-top:6px"><h2>Subjects</h2><p>Tap a subject to open its chapters</p></div>
    <div class="grid">${cards}</div>
    <p class="note glass">Chapter lists follow the NCERT Class 10 books. Always compare with the latest official syllabus on <a href="${CBSE}" target="_blank" rel="noopener">cbseacademic.nic.in</a> before you start, because CBSE can revise topics.</p>`;
}

function subject(s){
  const x=stat(s);
  const groups=s.groups.map(g=>{
    const gd=g.i.filter(c=>get(s.id,c).every(Boolean)).length;
    const rows=g.i.map(c=>{const v=get(s.id,c);return`<div class="ch ${v.every(Boolean)?'full':''}"><div class="name ${s.hi?'hi':''}">${esc(c)}</div>
      <div class="steps">${STAGES.map((st,k)=>`<label class="step"><input type="checkbox" data-s="${s.id}" data-c="${esc(c)}" data-k="${k}" ${v[k]?'checked':''}>${st}</label>`).join('')}</div></div>`}).join('');
    return`<section class="group glass"><h3 class="${s.hi?'hi':''}">${g.t}<span>${gd}/${g.i.length} done</span></h3>${rows}</section>`}).join('');
  return`<div class="chips">${mine().map(o=>`<a class="ghost" href="#${o.id}" ${o.id===s.id?'aria-current="page"':''}>${short(o)}</a>`).join('')}</div><section class="subj-head glass" style="--sc:${s.color}">${ring(x.pct,s.color)}
    <div><h1>${s.name}</h1><p>${s.sub}</p><p>${x.full} of ${x.n} chapters fully revised</p></div>
    <div class="links"><a class="ghost" style="text-decoration:none" href="${SYL[s.id]}" target="_blank" rel="noopener">Detailed syllabus (PDF)</a>
    <a class="ghost" style="text-decoration:none" href="${SQP}" target="_blank" rel="noopener">Sample papers</a></div></section>${groups}`;
}

function roadmap(){
  const dl=daysLeft();
  let phases;
  const base=[
   ['Learn','Cover every chapter once','Read the NCERT chapter, then solve all in-text and exercise questions.|Make short notes and formula or date sheets.|Tick "Study" the day you finish a chapter.',.5],
   ['Practise','Question-by-question work','Solve NCERT exemplar and chapter-wise questions.|Attempt CBSE sample papers by subject.|Tick "Practise" once you can solve without looking.',.2],
   ['Revise','Second and third pass','Revise from your own notes only.|Redo the questions you got wrong.|Tick "Revise" when a chapter feels easy.',.2],
   ['Mock tests','Full papers in exam timing','One full sample paper per day in 3 hours.|Check with the marking scheme and fix weak spots.|Sleep well and keep the last two days light.',.1]];
  if(dl&&dl>0){let t=new Date(new Date().toDateString()),acc=0;
    phases=base.map(p=>{const n=Math.max(1,Math.round(dl*p[3]));const a=new Date(t.getTime()+acc*864e5);acc+=n;const b=new Date(t.getTime()+(acc-1)*864e5);return{...p,when:`${fmt(a)} to ${fmt(b)} · ${n} days`}})}
  else phases=base.map(p=>({...p,when:Math.round(p[3]*100)+'% of your time'}));
  const rem=mine().map(s=>{const x=stat(s);return`<tr><td>${s.name}</td><td>${x.n-x.full}</td><td>${x.n}</td><td>${x.pct}%</td>${dl>0?`<td>${((x.n-x.full)/dl*7).toFixed(1)}</td>`:''}</tr>`}).join('');
  return`<div class="sec-title"><h2>Roadmap</h2><p>${dl>0?`${dl} days until ${fmt(new Date(S.exam+'T00:00:00'))}. Phases below are scaled to your date.`:'Set your exam date on the Home page to scale this plan to your calendar.'}</p></div>
  <div class="phases">${phases.map((p,i)=>`<div class="phase glass"><span class="tag">Phase ${i+1}</span><div class="when">${p.when}</div><h3>${p[0]}</h3><div style="color:var(--muted);font-size:14px">${p[1]}</div><ul>${p[2].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="sec-title" style="margin-top:6px"><h2>Where you stand</h2></div>
  <div class="tbl glass"><table><thead><tr><th>Subject</th><th>Chapters left</th><th>Total</th><th>Progress</th>${dl>0?'<th>Chapters per week needed</th>':''}</tr></thead><tbody>${rem}</tbody></table></div>`;
}

/* ---------- exam insights ---------- */
const TIER={A:['Must-do','Asked almost every year'],B:['High chance','Asked in most papers'],C:['Selective','Lower weight, learn after the rest']};
const FREQ=['','Occasionally asked','Asked in most years','Asked almost every year'];
const avgM=m=>{const n=(String(m).match(/\d+/g)||[]).map(Number);return n.length?n.reduce((a,b)=>a+b)/n.length:0};
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const dots=f=>'●'.repeat(f)+'○'.repeat(3-f);
const pdfBtn=(l,u,c)=>`<a class="${c||'ghost'}" style="text-decoration:none" href="${u}" target="_blank" rel="noopener">${l}</a>`;
let INF={tier:'all',pyq:false,q:'',sid:''};
const insBar=(l,v,max,t)=>`<div class="wb"><span class="wl">${esc(l)}</span><span class="wt"><i class="t${t||'A'}" style="width:${Math.round(v/max*100)}%"></i></span><b>${Number.isInteger(v)?v:v.toFixed(1)}</b></div>`;
const ytOk=u=>/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(u||'');
const vids=(s,c)=>{const v=(typeof VIDEOS!=='undefined'&&VIDEOS[s.id+'|'+c.n])||{};
  const full=ytOk(v.full)?v.full:yt(`Class 10 ${s.name} ${c.n} full chapter explanation CBSE`),quick=ytOk(v.quick)?v.quick:yt(`Class 10 ${s.name} ${c.n} important questions one shot revision 2027`);
  return`<div class="acts">${pdfBtn(ytOk(v.full)?'▶ Watch full chapter':'▶ Full chapter videos',full,'ghost')}${pdfBtn(ytOk(v.quick)?'▶ Watch quick revision':'▶ Quick revision videos',quick,'ghost')}<a class="ghost" style="text-decoration:none" href="#${s.id}">Open in tracker</a></div>`};
const topicLi=(s,h)=>`<li><span class="fq" title="${FREQ[h.f]}" aria-label="${FREQ[h.f]}">${dots(h.f)}</span><span class="${s.hi?'hi':''}">${esc(h.t)}</span>${h.f>=2?'<span class="pyq" title="Asked in previous year board papers">PYQ</span>':''}</li>`;
function insCard(s,c){
  const dn=get(s.id,c.n).reduce((a,b)=>a+b,0),hot=INF.pyq?c.hot.filter(h=>h.f>=2):c.hot,hi=s.hi?'hi':'';
  return`<details class="insch glass tier${c.t}"><summary><span class="in ${hi}">${esc(c.n)}</span><span class="badges"><span>${/\d/.test(c.m)?esc(c.m)+' marks':esc(c.m)}</span><span class="tr">${TIER[c.t][0]}</span><span>${dn}/3 done</span></span></summary>
  <div class="inb">${c.life?`<p class="${hi}"><b>${s.id==='hindi'?'लेखक / कवि':'About the writer'}:</b> ${esc(c.life)}</p>`:''}
  <h4>What gets asked <small>(● ● ● = how often · PYQ = seen in previous board papers)</small></h4><ul class="hot">${hot.map(h=>topicLi(s,h)).join('')}</ul>
  <p class="${hi}"><b>Strategy:</b> ${esc(c.tip)}</p>${c.prep?`<p class="${hi}"><b>How to prepare:</b> ${esc(c.prep)}</p>`:''}${vids(s,c)}</div></details>`;
}
const insFilter=s=>{const q=INF.q.trim().toLowerCase();return INS[s.id].ch.filter(c=>(INF.tier==='all'||c.t===INF.tier)&&(!INF.pyq||c.hot.some(h=>h.f>=2))&&(!q||(c.n+' '+c.hot.map(h=>h.t).join(' ')).toLowerCase().includes(q)))};
const insList=s=>{const l=insFilter(s);return l.length?l.map(c=>insCard(s,c)).join(''):'<p class="note glass">No chapter matches these filters.</p>'};

function insPattern(s){
  const d=INS[s.id],p=d.pattern,umax=Math.max(...p.units.map(u=>u[1]));
  const chs=d.ch.map(c=>[c.n,avgM(c.m),c.t]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),cmax=Math.max(...chs.map(x=>x[1]));
  return`<div class="note glass">${esc(p.note)}</div>
  <div class="tbl glass"><table><thead><tr><th>Section</th><th>Type of question</th><th>Questions × marks</th><th>Marks</th></tr></thead><tbody>${p.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <section class="group glass"><h3>Marks by unit<span>approximate</span></h3>${p.units.map(u=>insBar(u[0],u[1],umax)).join('')}</section>
  <section class="group glass"><h3>Chapter weightage<span>typical marks · colour = priority</span></h3>${chs.map(x=>insBar(x[0],x[1],cmax,x[2])).join('')}</section>
  <section class="group glass"><h3>Trends from recent papers</h3><ul class="tr">${d.trend.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;
}
function insChapters(s){
  INF.sid=s.id;
  return`<div class="insf"><input type="search" id="insQ" placeholder="Search a chapter or topic" value="${esc(INF.q)}" aria-label="Search chapters and topics">
  ${[['all','All'],['A','Must-do'],['B','High chance'],['C','Selective']].map(([k,l])=>`<button type="button" class="ghost" data-itier="${k}" ${INF.tier===k?'aria-current="page"':''}>${l}</button>`).join('')}
  <button type="button" class="ghost" id="insPyq" ${INF.pyq?'aria-current="page"':''}>PYQ topics only</button></div>
  <div style="display:flex;flex-direction:column;gap:10px" id="inslist">${insList(s)}</div>`;
}
function insMust(s){
  const d=INS[s.id],ms=d.ch.filter(c=>c.t==='A').sort((a,b)=>avgM(b.m)-avgM(a.m)),hi=s.hi?'hi':'';
  return`<div class="note glass"><b>Must-do topics.</b> These chapters carry the most marks and their topics have appeared in almost every recent paper. No one can promise a particular question, so treat this as "very high chance", and still cover the rest. Videos open YouTube search for that chapter. Channels that cover the CBSE syllabus well: ${esc(d.channels)}.</div>
  ${ms.map(c=>{const t=c.hot.filter(h=>h.f===3);return`<section class="group glass"><h3 class="${hi}">${esc(c.n)}<span>${/\d/.test(c.m)?esc(c.m)+' marks':esc(c.m)}</span></h3>
   <ul class="hot">${(t.length?t:c.hot.filter(h=>h.f>=2)).map(h=>topicLi(s,h)).join('')}</ul>${c.prep?`<p class="${hi}" style="margin:8px 0 0;font-size:14px"><b>How to prepare:</b> ${esc(c.prep)}</p>`:''}${vids(s,c)}</section>`}).join('')}`;
}
function paperRows(sid){
  const P=PAPERS[sid];
  return P.sqp.map(([n,a,b])=>`<div class="pl"><span>${esc(n)}</span>${pdfBtn('Sample paper (PDF)',a,'btn')}${pdfBtn('Marking scheme (PDF)',b,'ghost')}</div>`).join('');
}
function insPapers(s){
  const P=PAPERS[s.id];
  return`<section class="group glass"><h3>Sample question paper 2026-27<span>direct PDF</span></h3>${paperRows(s.id)}${P.sqpNote?`<p class="sub" style="margin:8px 0 0">${esc(P.sqpNote)}</p>`:''}</section>
  <section class="group glass"><h3>Previous year question papers <span class="pyq">PYQ</span></h3>
   ${P.pyq.map(([n,u])=>`<div class="pl"><span>${esc(n)}</span>${pdfBtn(/\.pdf$/.test(u)?'Download PDF':'Download (ZIP of PDFs)',u,'ghost')}<span></span></div>`).join('')}
   <p class="sub" style="margin:8px 0 0">CBSE publishes most previous year papers as a ZIP for each exam. Open the ZIP on your phone or computer to get the PDFs. These links go straight to the official files on cbse.gov.in.</p></section>
  <section class="group glass"><h3>Syllabus</h3><div class="pl"><span>Detailed syllabus 2026-27</span>${pdfBtn('Syllabus (PDF)',SYL[s.id],'ghost')}<span></span></div></section>`;
}
function insights(sid,tab){
  if(!sid||!INS[sid]){

/* ---------- schedule ---------- */
function schedule(){
  const today=new Date(new Date().toDateString());let next=-1;
  const SC=SCHED.filter(r=>mine().some(s=>s.id===r[0]));
  const rows=SC.map(([id,d,t,label],i)=>{const s=SUBJECTS.find(x=>x.id===id),dt=new Date(d+'T00:00:00'),n=Math.round((dt-today)/864e5);if(n>=0&&next<0)next=i;
    const gap=i?Math.round((dt-new Date(SC[i-1][1]+'T00:00:00'))/864e5)-1:0;return{s,dt,n,t,label,gap,i,x:stat(s)}});
  return`<div class="sec-title"><h2>Board exam schedule</h2><p>CBSE Class 10 · 2027 · papers start 10:30 AM</p></div>
  <div class="sch">${rows.map(r=>`<article class="ex glass ${r.i===next?'next':''}" style="--sc:${r.s.color}">
    <div class="dt"><b>${r.dt.getDate()}</b><span>${r.dt.toLocaleDateString('en-IN',{month:'short'})}</span><small>${r.dt.toLocaleDateString('en-IN',{weekday:'short'})}</small></div>
    <div class="exb"><h3>${r.s.name}${r.i===next?' <span class="tag">Next</span>':''}</h3>
    <div class="meta">${r.label}</div>
    <div class="meta">${r.t}${r.n>0?` · in ${r.n} day${r.n>1?'s':''}`:r.n===0?' · <b>today</b>':' · done'}${r.gap>0?` · ${r.gap} free day${r.gap>1?'s':''} before it`:''}</div>
    <div class="bar"><i style="width:${r.x.pct}%"></i></div><div class="meta">${r.x.pct}% prepared</div>
    <div class="acts"><a class="btn" href="${SYL[r.s.id]}" target="_blank" rel="noopener">Detailed syllabus</a><a class="ghost" style="text-decoration:none" href="#${r.s.id}">Open chapters</a></div></div></article>`).join('')}</div>
  <p class="note glass">Dates and timings follow the CBSE Class 10 date sheet released in November 2026. IT is a 2-hour paper (10:30 AM to 12:30 PM). CBSE also plans a second board exam window in May 2027. Always confirm on <a href="https://www.cbse.gov.in/" target="_blank" rel="noopener">cbse.gov.in</a>.</p>`;
}

async function onGoogle(r){
  const linking=!!USER;
  try{
    const j=await api(linking?'/profile/google':'/auth/google',{method:'POST',body:JSON.stringify({credential:r.credential})});
    if(linking){USER=j.user;store();route();say('gmsg','Google connected ✓',1)}
    else{TOKEN=j.token;USER=j.user;store();applyServer(j.progress);
      if(j.passwordReset){NOTICE='We linked Google to your existing account and removed its old password for safety. You can set a new password below if you want one.';location.hash='#account'}else location.hash='#home';
